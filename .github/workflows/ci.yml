name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend + portal build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, captive-portal]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: |
          if [ "${{ matrix.package }}" = "frontend" ]; then
            # Served under /app/ by captive-portal nginx
            npx tsc -b && npx vite build --base=/app/
          else
            npm run build
          fi

  # Workspace lib unit tests only (--lib): skips integration/bin tests that are
  # heavier or environment-dependent. Prefer --exclude <crate> (and document in
  # devops/README.md) over continue-on-error if a single crate is known broken.
  rust-lib:
    name: Cargo test (workspace lib)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-lib

      - name: cargo test --workspace --lib
        run: cargo test --workspace --lib

  # Produces the engine.wasm artifact the sandbox loads at runtime (issue #11).
  # The devops script builds engine for wasm32-wasip1 as a cdylib and stages
  # the artifact into sandbox/assets/, so the daemon never starts against a
  # missing file. The wasm magic bytes are checked to catch empty/corrupt output.
  engine-wasm-artifact:
    name: Build engine.wasm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-engine-wasm

      - name: Build and stage engine.wasm
        run: ./devops/build-engine-wasm.sh

      - name: Verify artifact
        run: |
          test -f sandbox/assets/engine.wasm
          head -c 4 sandbox/assets/engine.wasm | od -An -tx1 | grep -q "00 61 73 6d"

      - name: Upload engine.wasm
        uses: actions/upload-artifact@v4
        with:
          name: engine-wasm
          path: sandbox/assets/engine.wasm

  # The `bundled-engine` feature embeds sandbox/assets/engine.wasm via
  # include_bytes! (issue #146). sandbox/build.rs gates the embed on the
  # asset's presence at compile time, so this job proves both paths: the
  # artifact download exercises the real embed, and the follow-up check
  # with the asset removed proves the graceful degradation.
  rust-bundled-engine:
    name: cargo test sandbox (bundled-engine)
    runs-on: ubuntu-latest
    needs: [engine-wasm-artifact]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-bundled-engine

      - name: Download engine.wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: engine-wasm
          path: sandbox/assets/

      - name: Verify staged artifact
        run: head -c 4 sandbox/assets/engine.wasm | od -An -tx1 | grep -q "00 61 73 6d"

      - name: cargo test --locked -p sandbox --features bundled-engine
        run: cargo test --locked -p sandbox --features bundled-engine

      - name: Graceful degradation without the asset (issue #146)
        run: |
          rm sandbox/assets/engine.wasm
          cargo check --locked -p sandbox --features bundled-engine

  rust-fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  rust-clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-clippy

      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Guards against Windows MinGW/MSVC linker regressions (see issue #10):
  # host build scripts must link with the MSVC toolchain, not a broken
  # x86_64-w64-mingw32-gcc install.
  rust-windows:
    name: cargo check (windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-windows

      - name: cargo check --workspace
        run: cargo check --workspace

  # Engine is wasm32-wasip1-ready by design (see engine/Cargo.toml target
  # notes). Keep the WASM compilation pipeline green.
  rust-wasm:
    name: cargo check engine (wasm32-wasip1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-wasm

      - name: cargo check -p engine --target wasm32-wasip1
        run: cargo check -p engine --target wasm32-wasip1

  docker-portal:
    name: Docker portal image
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build captive-portal image
        run: docker build -f captive-portal/Dockerfile -t messymash/captive-portal:ci .
