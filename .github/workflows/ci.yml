name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend + portal build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, captive-portal]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: |
          if [ "${{ matrix.package }}" = "frontend" ]; then
            # Served under /app/ by captive-portal nginx
            npx tsc -b && npx vite build --base=/app/
          else
            npm run build
          fi

  # Workspace lib unit tests only (--lib): skips integration/bin tests that are
  # heavier or environment-dependent. Prefer --exclude <crate> (and document in
  # devops/README.md) over continue-on-error if a single crate is known broken.
  rust-lib:
    name: Cargo test (workspace lib)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-lib

      - name: cargo test --locked --workspace --lib
        run: cargo test --locked --workspace --lib

  # Produces the engine.wasm artifact the sandbox loads at runtime (issue #11).
  # The devops script builds engine for wasm32-wasip1 as a cdylib and stages
  # the artifact into sandbox/assets/, so the daemon never starts against a
  # missing file. The wasm magic bytes are checked to catch empty/corrupt output.
  engine-wasm-artifact:
    name: Build engine.wasm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-engine-wasm

      - name: Build and stage engine.wasm
        run: ./devops/build-engine-wasm.sh

      - name: Verify artifact
        run: |
          test -f sandbox/assets/engine.wasm
          head -c 4 sandbox/assets/engine.wasm | od -An -tx1 | grep -q "00 61 73 6d"

      - name: Upload engine.wasm
        uses: actions/upload-artifact@v4
        with:
          name: engine-wasm
          path: sandbox/assets/engine.wasm

  rust-fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  rust-clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-clippy

      - name: cargo clippy --locked --workspace --all-targets
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # Non-default feature combinations rot silently when CI only exercises
  # default features (issue #147). Each entry mirrors a documented command:
  # sandbox's `wamr` feature and engine's `syzygy` / `syzygy-mmap` features.
  # integration's `transport` variant is covered by the integration-smoke
  # job instead of being duplicated here.
  rust-feature-matrix:
    name: Feature matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sandbox-wamr
            run: cargo test --locked -p sandbox --features wamr
          - name: engine-syzygy
            run: cargo check --locked -p engine --features syzygy
          - name: engine-syzygy-mmap
            run: cargo check --locked -p engine --features syzygy-mmap
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: rust-feature-matrix-${{ matrix.name }}

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  # Cross-crate smoke tests are a documented merge gate
  # (docs/interface-contracts.md section 8), but no job ran them
  # (issue #172). Runs the default suite plus the `transport` feature
  # variant that gates the NET-26 partition/merge tests.
  integration-smoke:
    name: Integration smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-integration-smoke

      - name: cargo test --locked -p integration
        run: cargo test --locked -p integration

      - name: cargo test --locked -p integration --features transport
        run: cargo test --locked -p integration --features transport

  # Guards against Windows MinGW/MSVC linker regressions (see issue #10):
  # host build scripts must link with the MSVC toolchain, not a broken
  # x86_64-w64-mingw32-gcc install.
  # Issue #148: check --all-targets so bins and #[cfg(test)] code compile on
  # Windows too, and run the lib test suite there. No crate is excluded; if
  # one ever needs excluding, use --exclude and document it in
  # devops/README.md per the rule on the rust-lib job.
  rust-windows:
    name: cargo check + test (windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-windows

      - name: cargo check --locked --workspace --all-targets
        run: cargo check --locked --workspace --all-targets

      - name: cargo test --locked --workspace --lib
        run: cargo test --locked --workspace --lib

  # Engine is wasm32-wasip1-ready by design (see engine/Cargo.toml target
  # notes). Keep the WASM compilation pipeline green.
  rust-wasm:
    name: cargo check engine (wasm32-wasip1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-wasm

      - name: cargo check --locked -p engine --target wasm32-wasip1
        run: cargo check --locked -p engine --target wasm32-wasip1

  docker-portal:
    name: Docker portal image
    runs-on: ubuntu-latest
    needs: [frontend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build captive-portal image
        run: docker build -f captive-portal/Dockerfile -t mossymesh/captive-portal:ci .

      - name: Run and smoke-test the image
        run: |
          docker run -d --name mm-portal -p 127.0.0.1:8080:80 mossymesh/captive-portal:ci
          ok=0
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf http://127.0.0.1:8080/healthz | grep -q "^ok$"; then ok=1; break; fi
          done
          if [ "$ok" = 0 ]; then echo "portal never became healthy"; docker logs mm-portal; exit 1; fi
          curl -sf http://127.0.0.1:8080/app/ | grep -qi "<html"
          echo "portal healthy"

      - name: Remove portal container
        if: always()
        run: docker rm -f mm-portal || true
