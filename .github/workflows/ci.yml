name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend + portal build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, captive-portal]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: |
          if [ "${{ matrix.package }}" = "frontend" ]; then
            # Served under /app/ by captive-portal nginx
            npx tsc -b && npx vite build --base=/app/
          else
            npm run build
          fi

  # Workspace lib unit tests only (--lib): skips integration/bin tests that are
  # heavier or environment-dependent. Prefer --exclude <crate> (and document in
  # devops/README.md) over continue-on-error if a single crate is known broken.
  rust-lib:
    name: Cargo test (workspace lib)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-lib

      - name: cargo test --workspace --lib
        run: cargo test --workspace --lib

  # Produces the engine.wasm artifact the sandbox loads at runtime (issue #11).
  # The devops script builds engine for wasm32-wasip1 as a cdylib and stages
  # the artifact into sandbox/assets/, so the daemon never starts against a
  # missing file. The wasm magic bytes are checked to catch empty/corrupt output.
  engine-wasm-artifact:
    name: Build engine.wasm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-engine-wasm

      - name: Build and stage engine.wasm
        run: ./devops/build-engine-wasm.sh

      - name: Verify artifact
        run: |
          test -f sandbox/assets/engine.wasm
          head -c 4 sandbox/assets/engine.wasm | od -An -tx1 | grep -q "00 61 73 6d"

      - name: Upload engine.wasm
        uses: actions/upload-artifact@v4
        with:
          name: engine-wasm
          path: sandbox/assets/engine.wasm

  rust-fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  rust-clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-clippy

      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Guards against Windows MinGW/MSVC linker regressions (see issue #10):
  # host build scripts must link with the MSVC toolchain, not a broken
  # x86_64-w64-mingw32-gcc install.
  rust-windows:
    name: cargo check (windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-windows

      - name: cargo check --workspace
        run: cargo check --workspace

  # Engine is wasm32-wasip1-ready by design (see engine/Cargo.toml target
  # notes). Keep the WASM compilation pipeline green.
  rust-wasm:
    name: cargo check engine (wasm32-wasip1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-wasm

      - name: cargo check -p engine --target wasm32-wasip1
        run: cargo check -p engine --target wasm32-wasip1

  # Regression guard for the boot panic found by the Oct 2026 operational
  # review: run_http_server registered /api-docs/openapi.json twice and Axum
  # panicked, killing the daemon on every boot. 520 unit tests were green
  # because none ever executed main(), so this boots the real binary and
  # asserts the gateway answers /api/v1/health with HTTP 200.
  daemon-smoke:
    name: Daemon boot smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-smoke

      - name: Build mesh-daemon
        run: cargo build --bin mesh-daemon

      - name: Boot daemon and assert /api/v1/health
        run: ./devops/smoke-boot.sh

  # Regression guard for the Oct 2026 operational review finding that mesh
  # networking was theater (listen/dial/bootstrap helpers had zero callers,
  # boot invented fake peers, no node ever sent a packet). Boots two real
  # mesh-daemon processes in REAL p2p mode and asserts they connect and
  # exchange real ping packets over real sockets.
  p2p-smoke:
    name: Real p2p two-node smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: workspace-smoke

      - name: Build mesh-daemon
        run: cargo build --bin mesh-daemon

      - name: Two real daemons connect and ping over real sockets
        run: ./devops/smoke-p2p.sh

  docker-portal:
    name: Docker portal image
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build captive-portal image
        run: docker build -f captive-portal/Dockerfile -t messymash/captive-portal:ci .
