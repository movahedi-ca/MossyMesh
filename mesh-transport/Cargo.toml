[package]
name = "mesh-transport"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
libp2p = { version = "0.53.2", features = ["tokio", "tcp", "dns", "noise", "yamux", "kad", "macros", "ping"] }
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4.21"
sha2 = "0.10"
num-bigint = "0.4"
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
getrandom = "0.2"
# Real signatures for BLE link-state advertisements (issue #205).
# Precedent: consensus/ and governance/ already use ed25519-dalek 2.x.
ed25519-dalek = "2.2"

# Path deps for the mesh-daemon binary (mesh-transport/src/main.rs).
consensus = { path = "../consensus" }
engine = { path = "../engine" }
sandbox = { path = "../sandbox" }
interop = { path = "../interop" }

[lib]
name = "mesh_transport"
path = "src/lib.rs"

[[bin]]
name = "mesh-daemon"
path = "src/main.rs"


[lints]
workspace = true
