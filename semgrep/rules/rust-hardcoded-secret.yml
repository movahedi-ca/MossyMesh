rules:
  - id: rust-hardcoded-secret
    languages: [rust]
    severity: ERROR
    message: >-
      Possible hardcoded secret. Secrets belong in config or the environment,
      never in source. If this is a test fixture, move it under tests/.
    patterns:
      - pattern-either:
          - pattern-regex: (?i)(password|passwd|api[_-]?key|secret|token)\s*[:=]\s*"[^"]{4,}"
          - pattern-regex: AKIA[0-9A-Z]{16}
          - pattern-regex: "-----BEGIN [A-Z ]*PRIVATE KEY-----"
    paths:
      exclude:
        - "**/tests/**"
        - "**/*test*.rs"
    metadata:
      category: security
      confidence: MEDIUM
