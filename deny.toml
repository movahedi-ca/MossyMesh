# cargo-deny configuration (scan pipeline, phase 1).
# Checked by the cargo-deny CI job and runnable locally with `cargo deny check`.
[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
# cargo-deny 0.18+: unmaintained takes a scope (which crates to check),
# not a lint level; informational advisories surface as warnings.
unmaintained = "workspace"
# Pre-existing findings, each with a tracking issue. The gate stays green
# for new advisories; these are conscious decisions, not silent passes.
ignore = [
    # bincode 1.3.3 is unmaintained with no safe upgrade; migrating
    # consensus serialization (e.g. to postcard) is a real refactor.
    { id = "RUSTSEC-2025-0141", reason = "Tracked in #265; migration is a wire-format refactor, not a version bump." },
    # hickory-proto 0.24.4 DoS via name compression; arrives transitively
    # via libp2p-dns, so the fix is a libp2p upgrade.
    { id = "RUSTSEC-2026-0119", reason = "Tracked in #266; needs a libp2p upgrade, not a patch bump." },
    # serde_cbor 0.11 is unmaintained; consensus uses it directly for CBOR.
    # Swapping it touches the wire format.
    { id = "RUSTSEC-2021-0127", reason = "Tracked in #267; needs a careful serialization migration." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    # GPL-3.0-or-later: compatible with this repo's AGPL-3.0. Required by
    # shakmaty-syzygy (engine's Syzygy tablebase support). Allowed
    # deliberately; revisit if the project's license posture ever changes.
    "GPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path deps (consensus = { path = "../consensus" }) carry
# no version requirement; they are not real wildcards.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
