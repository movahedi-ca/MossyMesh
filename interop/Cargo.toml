[package]
name = "interop"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "MossyMesh interop: TWAMM, OpenAPI gateway, liquidity mining"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
utoipa = "5"
utoipa-swagger-ui = { version = "8", features = ["axum"] }

[lints]
workspace = true
